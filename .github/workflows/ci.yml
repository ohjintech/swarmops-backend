name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: swarmops-backend }
      # Sibling checkout so the go.mod `replace` resolves until contracts is released.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/swarmops-contracts
          path: swarmops-contracts
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: swarmops-backend/go.sum
      - working-directory: swarmops-backend
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test -race ./...

  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: swarmops-backend }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/swarmops-contracts
          path: swarmops-contracts
      - uses: astral-sh/setup-uv@v6
      - working-directory: swarmops-backend/planner
        run: |
          uv sync
          uv run ruff check .
          uv run pytest -q

  images:
    if: github.ref == 'refs/heads/main'
    needs: [go, planner]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: control-api, dockerfile: swarmops-backend/Dockerfile, service: control-api }
          - { name: telemetry, dockerfile: swarmops-backend/Dockerfile, service: telemetry }
          - { name: planner, dockerfile: swarmops-backend/planner/Dockerfile, service: "" }
    steps:
      - uses: actions/checkout@v4
        with: { path: swarmops-backend }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/swarmops-contracts
          path: swarmops-contracts
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/swarmops-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/swarmops-${{ matrix.name }}:${{ github.sha }}

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/swarmops-backend && git pull --ff-only
            docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml pull
            docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d
