[project]
name = "swarmops-planner"
version = "0.1.0"
description = "SwarmOps planning service (gRPC): coverage, task allocation"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.73.0",
  "numpy>=2.1",
  "scipy>=1.14",
  "shapely>=2.0",
  "swarmops-contracts",
]

[project.scripts]
planner = "planner.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.uv.sources]
# Local sibling checkout until swarmops-contracts publishes a release.
swarmops-contracts = { path = "../../swarmops-contracts/gen/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
