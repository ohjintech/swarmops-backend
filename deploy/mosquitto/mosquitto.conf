# DEV ONLY: anonymous access. For production, replace with:
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
#   acl_file /mosquitto/config/acl
# and give fleet-sim / each backend service its own user restricted to swarm/v1/#.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
